<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de la investigación con ML y ciencia de datos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--violet:#7C68D8;--navy:#151B3D;--light:#F3F0FA;--cyan:#5CC8E8;--bg:#F3F0FA;--panel:#FFFFFF;--text:#151B3D;--muted:#5b6080;--line:#d9d3ee}
@media (prefers-color-scheme:dark){:root{--bg:#151B3D;--panel:#1d2450;--text:#F3F0FA;--muted:#b7b9d6;--line:#343c72}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:1.05rem;margin:0}
header .lang button{border:1px solid var(--violet);background:transparent;color:var(--text);padding:4px 10px;border-radius:999px;cursor:pointer;font-size:.8rem}
header .lang button[aria-pressed="true"]{background:var(--violet);color:#fff}
main{flex:1;min-height:0;display:flex}
aside{width:320px;max-width:42vw;overflow:auto;padding:14px;background:var(--panel);border-right:1px solid var(--line);font-size:.88rem}
aside h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px}
aside h2:first-child{margin-top:0}
label.chk{display:flex;align-items:center;gap:8px;margin:3px 0;cursor:pointer}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
select,input[type=range]{width:100%}
select{padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns button{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:5px 10px;border-radius:8px;cursor:pointer;font-size:.8rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.stat{background:var(--bg);border-radius:10px;padding:8px}
.stat b{display:block;font-size:1.15rem;color:var(--violet)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:8px}
details{margin-top:14px;font-size:.82rem;color:var(--muted)}
details summary{cursor:pointer;color:var(--text);font-weight:600}
#map{flex:1;min-width:0}
#msg{position:absolute;inset:auto 16px 16px auto;z-index:1000;background:var(--panel);border:1px solid var(--line);padding:10px 12px;border-radius:10px;max-width:340px;font-size:.85rem;display:none}
@media (max-width:760px){main{flex-direction:column-reverse}aside{width:100%;max-width:none;height:42%;border-right:0;border-top:1px solid var(--line)}}
.leaflet-popup-content{font-family:inherit;font-size:.85rem}
.leaflet-popup-content b{display:block;margin-bottom:2px}
</style>
</head>
<body>
<header>
  <h1 data-i18n="title">Mapa de la investigación con ML y ciencia de datos</h1>
  <div class="lang" role="group" aria-label="Idioma">
    <button id="l-es" aria-pressed="true">ES</button><button id="l-en" aria-pressed="false">EN</button>
  </div>
</header>
<main>
  <aside>
    <h2 data-i18n="f_source">Fuente</h2><div id="f-source"></div>
    <h2 data-i18n="f_field">Línea de investigación</h2>
    <select id="f-field"></select>
    <h2 data-i18n="f_type">Sector de la institución</h2><div id="f-type"></div>
    <h2 data-i18n="f_min">Mínimo de obras por institución</h2>
    <input id="f-min" type="range" min="1" max="200" value="1"><div id="f-min-v" style="color:var(--muted)">1</div>
    <h2 data-i18n="f_go">Ir a</h2>
    <div class="btns"><button data-go="world" data-i18n="go_world">Mundo</button><button data-go="mx" data-i18n="go_mx">México</button><button data-go="mid" data-i18n="go_mid">Mérida</button></div>
    <h2 data-i18n="f_sum">Resumen</h2>
    <div class="stats">
      <div class="stat"><b id="s-inst">0</b><span data-i18n="s_inst">instituciones</span></div>
      <div class="stat"><b id="s-works">0</b><span data-i18n="s_works">participaciones</span></div>
      <div class="stat"><b id="s-country">0</b><span data-i18n="s_country">países</span></div>
      <div class="stat"><b id="s-top">–</b><span data-i18n="s_top">país con más</span></div>
    </div>
    <div class="bar" id="bar" aria-hidden="true"></div>
    <details><summary data-i18n="m_title">Cómo leer este mapa y sus límites</summary>
      <p data-i18n="m_body"></p><p id="meta-line"></p>
    </details>
  </aside>
  <div id="map"></div>
</main>
<div id="msg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const I18N={
 es:{title:"Mapa de la investigación con ML y ciencia de datos",f_source:"Fuente",f_field:"Línea de investigación",f_type:"Sector de la institución",f_min:"Mínimo de obras por institución",f_go:"Ir a",go_world:"Mundo",go_mx:"México",go_mid:"Mérida",f_sum:"Resumen",s_inst:"instituciones",s_works:"participaciones",s_country:"países",s_top:"país con más",all:"Todas las líneas",
  m_title:"Cómo leer este mapa y sus límites",
  m_body:"Cada círculo es una institución; su tamaño es el número de publicaciones con ciencia de datos o machine learning en el título o el resumen, en las fuentes elegidas. Una obra con autores de varias instituciones cuenta en cada una (por eso se habla de participaciones). Mide publicaciones, no proyectos, y la detección de ML por palabras clave puede fallar. El tipo de institución y su ubicación vienen de OpenAlex.",
  works:"obras",country:"País",city:"Ciudad",type:"Sector",top_fields:"Principales líneas",fecha:"Fecha de corte",criterio:"Criterio",
  nodata:"No encontré data/instituciones.csv. Ejecuta el cuaderno de Colab y sube el archivo a web/data/.",
  types:{education:"Educación",company:"Empresa",government:"Gobierno",nonprofit:"Sin fines de lucro",healthcare:"Salud",facility:"Instalación científica",archive:"Archivo",other:"Otro"}},
 en:{title:"Map of ML and data science research",f_source:"Source",f_field:"Research line",f_type:"Institution sector",f_min:"Minimum works per institution",f_go:"Go to",go_world:"World",go_mx:"Mexico",go_mid:"Mérida",f_sum:"Summary",s_inst:"institutions",s_works:"participations",s_country:"countries",s_top:"top country",all:"All research lines",
  m_title:"How to read this map and its limits",
  m_body:"Each circle is an institution; its size is the number of publications mentioning data science or machine learning in the title or abstract, in the selected sources. A work with authors from several institutions counts for each one (hence “participations”). It measures publications, not projects, and keyword-based ML detection can miss or over-include. Institution type and location come from OpenAlex.",
  works:"works",country:"Country",city:"City",type:"Sector",top_fields:"Top research lines",fecha:"Snapshot date",criterio:"Criterion",
  nodata:"I could not find data/instituciones.csv. Run the Colab notebook and upload the file to web/data/.",
  types:{education:"Education",company:"Company",government:"Government",nonprofit:"Nonprofit",healthcare:"Healthcare",facility:"Research facility",archive:"Archive",other:"Other"}}
};
const FIELDS_ES={"Agricultural and Biological Sciences":"Ciencias agrícolas y biológicas","Arts and Humanities":"Artes y humanidades","Biochemistry, Genetics and Molecular Biology":"Bioquímica, genética y biología molecular","Business, Management and Accounting":"Negocios, gestión y contabilidad","Chemical Engineering":"Ingeniería química","Chemistry":"Química","Computer Science":"Ciencias de la computación","Decision Sciences":"Ciencias de la decisión","Dentistry":"Odontología","Earth and Planetary Sciences":"Ciencias de la Tierra y planetarias","Economics, Econometrics and Finance":"Economía, econometría y finanzas","Energy":"Energía","Engineering":"Ingeniería","Environmental Science":"Ciencias ambientales","Health Professions":"Profesiones de la salud","Immunology and Microbiology":"Inmunología y microbiología","Materials Science":"Ciencia de materiales","Mathematics":"Matemáticas","Medicine":"Medicina","Neuroscience":"Neurociencia","Nursing":"Enfermería","Pharmacology, Toxicology and Pharmaceutics":"Farmacología, toxicología y farmacéutica","Physics and Astronomy":"Física y astronomía","Psychology":"Psicología","Social Sciences":"Ciencias sociales","Veterinary":"Veterinaria"};
const TYPE_COLOR={education:"#7C68D8",company:"#E8833A",government:"#5CC8E8",nonprofit:"#3FB28B",healthcare:"#E4577A",facility:"#9AA0B5",archive:"#C9B458",other:"#6B7280"};

let lang="es", DATA=[], META=null, map, layer;
const state={sources:new Set(),types:new Set(),field:"",min:1};
const t=k=>I18N[lang][k]??k;
const fieldName=f=>lang==="es"?(FIELDS_ES[f]||f):f;

/* ---- lógica pura (se puede probar sin navegador) ---- */
function parseCSV(text){
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur=""}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur="";if(row.length>1||row[0]!=="")rows.push(row);row=[]}
    else cur+=c}
  if(cur!==""||row.length){row.push(cur);rows.push(row)}
  const head=rows.shift();
  return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h.trim(),r[i]])));
}
function aggregate(rows,f){
  const m=new Map();
  for(const r of rows){
    if(!f.sources.has(r.source_group)||!f.types.has(r.type))continue;
    if(f.field&&r.field!==f.field)continue;
    const w=+r.works;if(!(w>0))continue;
    let o=m.get(r.institution_id);
    if(!o){o={id:r.institution_id,name:r.institution,type:r.type,country:r.country_code,city:r.city,lat:(r.lat===""||r.lat==null?NaN:+r.lat),lon:(r.lon===""||r.lon==null?NaN:+r.lon),works:0,fields:{}};m.set(r.institution_id,o)}
    o.works+=w;o.fields[r.field]=(o.fields[r.field]||0)+w;
  }
  return [...m.values()].filter(o=>o.works>=f.min&&isFinite(o.lat)&&isFinite(o.lon)).sort((a,b)=>b.works-a.works);
}
function radius(w){return Math.min(3+1.6*Math.sqrt(w),30)}
/* ---------------------------------------------------- */

function typeLabel(k){return I18N[lang].types[k]||k}
function buildFilters(){
  const srcs=[...new Set(DATA.map(r=>r.source_group))].sort();
  const types=[...new Set(DATA.map(r=>r.type||"other"))].sort();
  const fields=[...new Set(DATA.map(r=>r.field))].sort();
  if(!state.sources.size)srcs.forEach(s=>state.sources.add(s));
  if(!state.types.size)types.forEach(s=>state.types.add(s));
  const fs=document.getElementById("f-source");fs.innerHTML="";
  srcs.forEach(s=>fs.append(chk(s,state.sources,()=>s)));
  const ft=document.getElementById("f-type");ft.innerHTML="";
  types.forEach(s=>ft.append(chk(s,state.types,()=>typeLabel(s),TYPE_COLOR[s]||"#6B7280")));
  const sel=document.getElementById("f-field");sel.innerHTML="";
  const o0=document.createElement("option");o0.value="";o0.textContent=t("all");sel.append(o0);
  fields.forEach(f=>{const o=document.createElement("option");o.value=f;o.textContent=fieldName(f);sel.append(o)});
  sel.value=state.field;
}
function chk(value,set,label,color){
  const l=document.createElement("label");l.className="chk";
  const i=document.createElement("input");i.type="checkbox";i.checked=set.has(value);
  i.onchange=()=>{i.checked?set.add(value):set.delete(value);render()};
  l.append(i);
  if(color){const d=document.createElement("span");d.className="dot";d.style.background=color;l.append(d)}
  const s=document.createElement("span");s.textContent=label();l.append(s);return l;
}
function popup(o){
  const d=document.createElement("div");
  const b=document.createElement("b");b.textContent=o.name;d.append(b);
  const lines=[[t("type"),typeLabel(o.type)],[t("country"),o.country+(o.city?" · "+o.city:"")],[t("works"),o.works]];
  lines.forEach(([k,v])=>{const p=document.createElement("div");p.textContent=k+": "+v;d.append(p)});
  const top=Object.entries(o.fields).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([f,n])=>fieldName(f)+" ("+n+")").join("; ");
  const p=document.createElement("div");p.style.marginTop="4px";p.textContent=t("top_fields")+": "+top;d.append(p);
  return d;
}
function render(){
  const agg=aggregate(DATA,{sources:state.sources,types:state.types,field:state.field,min:state.min});
  layer.clearLayers();
  agg.forEach(o=>{
    L.circleMarker([o.lat,o.lon],{radius:radius(o.works),color:TYPE_COLOR[o.type]||"#6B7280",weight:1,fillColor:TYPE_COLOR[o.type]||"#6B7280",fillOpacity:.55})
     .bindPopup(()=>popup(o)).bindTooltip(o.name+" · "+o.works).addTo(layer);
  });
  const total=agg.reduce((s,o)=>s+o.works,0);
  const byC={};agg.forEach(o=>byC[o.country]=(byC[o.country]||0)+o.works);
  const top=Object.entries(byC).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById("s-inst").textContent=agg.length.toLocaleString();
  document.getElementById("s-works").textContent=total.toLocaleString();
  document.getElementById("s-country").textContent=Object.keys(byC).length;
  document.getElementById("s-top").textContent=top?top[0]:"–";
  const bar=document.getElementById("bar");bar.innerHTML="";
  const byT={};agg.forEach(o=>byT[o.type]=(byT[o.type]||0)+o.works);
  Object.entries(byT).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{const s=document.createElement("span");s.style.cssText=`width:${100*v/Math.max(total,1)}%;background:${TYPE_COLOR[k]||"#6B7280"}`;s.title=typeLabel(k)+": "+v;bar.append(s)});
}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(e=>{e.textContent=t(e.dataset.i18n)});
  document.title=t("title");
  document.getElementById("l-es").setAttribute("aria-pressed",lang==="es");
  document.getElementById("l-en").setAttribute("aria-pressed",lang==="en");
  if(DATA.length){buildFilters();render()}
  if(META){document.getElementById("meta-line").textContent=`${t("fecha")}: ${META.fecha_de_corte||"–"}. ${t("criterio")}: ${META.criterio_ml||"–"}`}
}
function showMsg(txt){const m=document.getElementById("msg");m.textContent=txt;m.style.display="block"}
async function init(){
  map=L.map("map",{preferCanvas:true,worldCopyJump:true}).setView([20,0],2);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a>"}).addTo(map);
  layer=L.layerGroup().addTo(map);
  document.getElementById("l-es").onclick=()=>{lang="es";applyLang()};
  document.getElementById("l-en").onclick=()=>{lang="en";applyLang()};
  document.getElementById("f-field").onchange=e=>{state.field=e.target.value;render()};
  document.getElementById("f-min").oninput=e=>{state.min=+e.target.value;document.getElementById("f-min-v").textContent=state.min;render()};
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    const g={world:[[20,0],2],mx:[[23.5,-102],5],mid:[[20.97,-89.62],9]}[b.dataset.go];map.setView(g[0],g[1])});
  try{
    const r=await fetch("data/instituciones.csv");if(!r.ok)throw new Error(r.status);
    DATA=parseCSV(await r.text());
    try{const m=await fetch("data/meta.json");if(m.ok)META=await m.json()}catch(e){}
    applyLang();
  }catch(e){applyLang();showMsg(t("nodata"))}
}
if(typeof document!=="undefined"&&typeof L!=="undefined")init();
if(typeof module!=="undefined")module.exports={parseCSV,aggregate,radius};
</script>
</body>
</html>
